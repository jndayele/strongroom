# Render Blueprint for Strongroom (Phase 0 skeleton)
# Security header values below mirror /security/headers/security-headers.json (single source of truth).

services:
  # 1. Static Frontend (app.<domain>)
  - type: web
    name: strongroom-client
    runtime: static
    rootDir: client
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: dist
    autoDeploy: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.strongroom.example; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: "same-origin"
      - path: /*
        name: Cache-Control
        value: "no-store"
      - path: /*
        name: X-Frame-Options
        value: "DENY"

  # 2. Rust/Axum API Backend (api.<domain>)
  - type: web
    name: strongroom-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
