name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, sqlx prepare --check, test, deny, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_superuser_password
          POSTGRES_DB: vault_dev
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vault_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy

      - name: Install cargo-deny, cargo-audit, and sqlx-cli
        uses: taiki-e/install-action@955a6ff1416eae278c9f833008a9beb4b7f9afe3 # v2.49.15
        with:
          tool: cargo-deny,cargo-audit,sqlx-cli@0.8.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (offline mode via .sqlx metadata)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Initialize PostgreSQL roles and run migrations
        env:
          PGPASSWORD: ci_postgres_superuser_password
          POSTGRES_USER: postgres
          POSTGRES_DB: vault_dev
          VAULT_MIGRATOR_PASSWORD: local_migrator_password_only
          VAULT_APP_PASSWORD: local_app_password_only
          MIGRATOR_DATABASE_URL: postgres://vault_migrator:local_migrator_password_only@127.0.0.1:5432/vault_dev
        run: |
          psql -h 127.0.0.1 -v ON_ERROR_STOP=1 \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            -v db_name="$POSTGRES_DB" \
            -v migrator_password="$VAULT_MIGRATOR_PASSWORD" \
            -v app_password="$VAULT_APP_PASSWORD" \
            < <(sed -n '/<<'"'"'EOSQL'"'"'/,/^EOSQL$/{ /<<'"'"'EOSQL'"'"'/d; /^EOSQL$/d; p; }' infra/init-roles.sh)
          cargo sqlx migrate run --source apps/api/migrations --database-url "$MIGRATOR_DATABASE_URL"

      - name: Verify .sqlx offline query metadata is up to date
        env:
          DATABASE_URL: postgres://vault_app:local_app_password_only@127.0.0.1:5432/vault_dev
        run: cargo sqlx prepare --check --workspace -- --all-targets

      - name: Run tests
        env:
          DATABASE_URL: postgres://vault_app:local_app_password_only@127.0.0.1:5432/vault_dev
          MIGRATOR_DATABASE_URL: postgres://vault_migrator:local_migrator_password_only@127.0.0.1:5432/vault_dev
        run: cargo test --workspace

      - name: Run cargo-deny
        run: cargo deny check

      - name: Run cargo-audit
        run: cargo audit

  web:
    name: Web (npm ci, tsc, eslint, vitest, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (ignore scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Run tests
        run: npx vitest run

      - name: Audit dependencies
        run: npm audit

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
