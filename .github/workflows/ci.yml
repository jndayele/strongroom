name: Strongroom CI Security & Build Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/configs/gitleaks.toml

  osv-scan:
    name: Vulnerability Scan (OSV-Scanner)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run OSV-Scanner on lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@52cfbe7d2bb8bc7cdece7cd2ee1ebed4aa92c5d4 # v2.0.2
        with:
          scan-args: |-
            --lockfile=client/package-lock.json
            --lockfile=backend/Cargo.lock

  client:
    name: Client (npm ci --ignore-scripts, tsc, ESLint, Build)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.15.0"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (ignore-scripts)
        run: npm ci --ignore-scripts

      - name: TypeScript strict check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint security and strict lint check
        run: npm run lint

      - name: Build production client bundle
        run: npm run build

  backend:
    name: Backend (fmt, clippy -D warnings, test, header sync, deny, audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (1.86.0)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1 (toolchain 1.86.0)
        with:
          toolchain: "1.86.0"
          components: rustfmt, clippy

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Verify render.yaml and backend headers match security/headers/security-headers.json
        run: cargo test --test headers_sync --locked

      - name: Run backend integration and security tests
        run: cargo test --all-targets --locked

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@f9a75f0cb5ffe2ef9fb8eb8fc5fc2b36e3b3f1df # v2.0.5
        with:
          command: check --config ../security/configs/deny.toml
          manifest-path: backend/Cargo.toml

      - name: Run cargo-audit check
        uses: rustsec/audit-check@6f3dc3cd5fa4fc0a6b289c3b6aa5487792f34329 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend

  docker-backend:
    name: Backend Distroless Docker Build & Health Verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build distroless backend image
        run: docker build -t strongroom-backend:ci ./backend

      - name: Verify container runs read-only, non-root, and serves GET /health with security headers
        run: |
          docker run -d --name strongroom-backend-test \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -p 3000:3000 \
            strongroom-backend:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          HEADERS=$(curl -fsSI http://127.0.0.1:3000/health)
          echo "$HEADERS"
          echo "$HEADERS" | grep -iq "^content-security-policy:"
          echo "$HEADERS" | grep -iq "^strict-transport-security:"
          echo "$HEADERS" | grep -iq "^x-content-type-options: nosniff"
          echo "$HEADERS" | grep -iq "^referrer-policy: no-referrer"
          echo "$HEADERS" | grep -iq "^permissions-policy:"
          echo "$HEADERS" | grep -iq "^cross-origin-opener-policy: same-origin"
          echo "$HEADERS" | grep -iq "^cross-origin-resource-policy: same-origin"
          echo "$HEADERS" | grep -iq "^cache-control: no-store"
          docker rm -f strongroom-backend-test
