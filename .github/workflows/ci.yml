name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, migrate, test, deny, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_superuser_password
          POSTGRES_DB: vault_dev
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vault_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@955a6ff1416eae278c9f833008a9beb4b7f9afe3 # v2.49.15
        with:
          tool: cargo-deny,cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (offline mode via .sqlx metadata)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Initialize PostgreSQL roles via infra/init-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: ci_postgres_superuser_password
          POSTGRES_USER: postgres
          POSTGRES_DB: vault_dev
          VAULT_MIGRATOR_PASSWORD: local_migrator_password_only
          VAULT_APP_PASSWORD: local_app_password_only
        run: sh infra/init-roles.sh

      - name: Run database migrations via migrate binary
        env:
          SQLX_OFFLINE: "true"
          MIGRATOR_DATABASE_URL: postgres://vault_migrator:local_migrator_password_only@127.0.0.1:5432/vault_dev
        run: cargo run -p strongroom-api --bin migrate

      - name: Run tests
        env:
          SQLX_OFFLINE: "true"
          DATABASE_URL: postgres://vault_app:local_app_password_only@127.0.0.1:5432/vault_dev
          MIGRATOR_DATABASE_URL: postgres://vault_migrator:local_migrator_password_only@127.0.0.1:5432/vault_dev
        run: cargo test --workspace

      - name: Run cargo-deny
        run: cargo deny check

      - name: Run cargo-audit
        run: cargo audit

  web:
    name: Web & Crypto (npm ci, tsc, eslint, vitest, audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (ignore scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
