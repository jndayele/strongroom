[package]
name = "strongroom-api"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = "=0.8.1"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.139"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
sqlx = { version = "=0.8.3", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros"] }
