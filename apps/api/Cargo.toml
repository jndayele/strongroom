[package]
name = "strongroom-api"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate"] }
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
rand = { version = "=0.8.8", default-features = false, features = ["getrandom"] }
sha2 = { version = "=0.10.9", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
